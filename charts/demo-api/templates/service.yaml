apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "demo-api.labels" . | nindent 4 }}
spec:
  selector: {{- include "demo-api.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if eq .Values.strategy "blueGreen" }}
---
# Blue-green only: reaches the new version before it takes real traffic, for testing.
# Argo Rollouts adds a pod-template-hash to both selectors to keep the two versions apart.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-preview
  labels: {{- include "demo-api.labels" . | nindent 4 }}
spec:
  selector: {{- include "demo-api.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
