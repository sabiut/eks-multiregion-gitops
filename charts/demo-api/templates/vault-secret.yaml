{{- if .Values.vault.enabled }}
# How this namespace reaches Vault. External Secrets asks Kubernetes for a short-lived token
# for the demo-api ServiceAccount and presents it to Vault's Kubernetes auth method. Vault
# checks the token with the Kubernetes API, sees the ServiceAccount matches the role, and
# returns a Vault token limited by the demo-api policy.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  labels: {{- include "demo-api.labels" . | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.mount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
---
# What to fetch, and the Kubernetes Secret to build from it. Every key in the Vault secret
# becomes a key in the Secret, and so a file in the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-vault
  labels: {{- include "demo-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ .Release.Name }}-vault
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.vault.path | quote }}
{{- end }}
