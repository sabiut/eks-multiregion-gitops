{{- if .Values.networkPolicy.enabled }}
# The namespace denies all incoming traffic by default (platform-config). This opens one
# port, and only to the frontend pods in the same namespace. Nothing else in the cluster,
# and nothing outside it, can call the backend.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "demo-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "demo-api.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.fromPodLabels | nindent 14 }}
      ports:
        - port: {{ .Values.containerPort }}
{{- end }}
