apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "demo-web.labels" . | nindent 4 }}
spec:
  selector: {{- include "demo-web.labels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if gt (int .Values.replicas) 1 }}
---
# Only with more than one replica. With a single pod, "keep at least one running" would
# forbid ever moving it, and a node could then never be drained for an upgrade.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "demo-web.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "demo-web.labels" . | nindent 6 }}
{{- end }}
