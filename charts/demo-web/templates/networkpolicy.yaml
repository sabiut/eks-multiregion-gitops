{{- if .Values.networkPolicy.enabled }}
# The namespace denies all incoming traffic by default (platform-config). This opens the
# frontend to the load balancer's address range, and nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "demo-web.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "demo-web.labels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- else }}
        {{- fail "networkPolicy.ingressCIDRs must list at least one range" }}
        {{- end }}
      ports:
        - port: {{ .Values.containerPort }}
{{- end }}
